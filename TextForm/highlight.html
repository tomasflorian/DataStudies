<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextForm Highlighter</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  header { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 18px; margin: 0; }
  header button { font: inherit; font-size: 13px; }

  #editor .ProseMirror { background: white; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px;
                         min-height: 240px; outline: none; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  #editor p { margin: 0; }
  /* each highlight is one translucent layer (set in highlight.js), so overlaps build up */
  #editor .hll { margin: 0 -16px; padding: 0 16px; } /* whole lines: edge to edge of the editor */

  h2 { font-size: 14px; margin: 18px 0 6px; color: #555; }
  .row { display: flex; gap: 10px; align-items: center; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .row:hover { background: #eee; }
  .type { width: 9em; font: inherit; font-size: 13px; border: 1px solid #ddd; border-radius: 4px; padding: 1px 6px; background: white; }
  .type:placeholder-shown { border-style: dashed; }
  .kind { color: #888; min-width: 9em; }
  .text { font-family: ui-monospace, monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repeats { color: #a08000; font-size: 12px; }
  .remove { border: none; background: none; color: #999; cursor: pointer; font-size: 15px; }
  .hint { color: #888; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TextForm Highlighter</h1>
    <button id="highlight" title="Highlight the selection (Ctrl+Shift+H)">highlight</button>
    <button id="clear" title="Remove all highlights from the selection">× clear</button>
    <button id="reset">reset</button>
  </header>
  <div id="editor"></div>
  <div class="hint">Select words, a line or several lines, then click highlight or press Ctrl+Shift+H.
    Highlights can overlap; where they do, the yellow gets deeper. The same text anywhere else is highlighted automatically.</div>
  <h2>Highlights</h2>
  <div id="highlights"></div>
  <datalist id="types"></datalist>
</main>
<script src="dist/highlight.js"></script>
</body>
</html>
