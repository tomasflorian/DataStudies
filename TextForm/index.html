<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextForm</title>
<style>
  :root { --label: #5b6bb0; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0; }
  #mode { color: #666; font-size: 13px; min-width: 10em; }
  #pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .pill { border: 1px solid hsl(var(--h) 50% 60%); background: hsl(var(--h) 80% 92%); border-radius: 999px;
          padding: 3px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .pill.clear { --h: 0; background: white; border-color: #bbb; color: #555; }
  .pill small { opacity: 0.55; font-size: 11px; }
  .pill.within { box-shadow: 0 0 0 2px hsl(var(--h) 70% 45%); }
  .pill.active { background: hsl(var(--h) 70% 45%); color: white; }
  #pills input { border: 1px dashed #aaa; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 13px; width: 16em; }

  #editor .ProseMirror { background: white; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px;
                         min-height: 240px; outline: none; font-family: ui-monospace, monospace; white-space: pre-wrap; }
  #editor p { margin: 0; }
  #editor { position: relative; }
  #editor .ProseMirror { padding-left: calc(16px + var(--margin, 0px)); }
  /* objects that cover whole lines, drawn in the left margin by renderMargin() */
  #margin { position: absolute; top: 0; left: 10px; pointer-events: none; }
  .mobj { position: absolute; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .mobj .bar { align-self: stretch; flex: none; width: 3px; margin: 4px 0; border-radius: 2px; background: hsl(var(--h) 60% 50%); }
  .mobj .mtext { font: 10px/1 system-ui, sans-serif; color: hsl(var(--h) 60% 35%); white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .mobj.multi .mtext { writing-mode: vertical-rl; transform: rotate(180deg); }
  #editor:not(.labels) .mtext { display: none; }
  #editor.plain #margin { display: none; }
  /* colours off: no fills or lines in the text, every label and margin bar in one colour */
  #editor.mono .seg, #editor.mono .suggest { background: none; box-shadow: none; border: none; }
  #editor.mono .lbl > span, #editor.mono .mtext { color: var(--label); }
  /* colours off: labels placed by nesting depth, each on the top tread of a little stair */
  #editor .stair { display: none; position: absolute; bottom: 8px; overflow: visible; pointer-events: none; }
  #editor .stair path { fill: none; stroke: var(--label); stroke-width: 1; opacity: 0.55; }
  #editor.mono .stair { display: block; }
  #editor.mono .lbl > span { left: calc(-7px - var(--depth) * 7px); bottom: calc(15px + var(--depth) * 11px); }
  #editor.mono .lbl.linelbl > span { bottom: calc(15px + (var(--depth) + 1) * 11px); }
  #editor .linelbl .stair { display: none; }
  #editor.mono .bar { background: var(--label); }
  /* colours off: whole-line labels move from the margin to above the line (see paint in main.js) */
  #editor .lbl.linelbl { display: none; }
  #editor.mono.labels:not(.plain) .lbl.linelbl { display: inline-block; }
  #editor.mono #margin { display: none; }
  #editor.mono .ProseMirror { padding-left: 40px; }
  #editor.mono.labels:not(.plain) p.tall { padding-top: calc(var(--extra) * 11px); }
  /* drawing is done in main.js (the paint plugin): --h is the smallest object's colour,
     --lines its underline plus one line further down for every bigger object around it */
  #editor .seg { background: hsl(var(--h) 80% 88%); box-shadow: var(--lines); }
  /* two different objects touching: a thin bar where one ends and the next begins */
  #editor .touching { border-left: 2px solid hsl(var(--h) 60% 40%); }
  /* an existing object's text found untagged: offered, not applied. Double-click applies it. */
  #editor .suggest { background-image: repeating-linear-gradient(135deg, hsl(var(--sh) 70% 80%) 0 3px, transparent 3px 7px);
                     cursor: pointer; }
  #editor .suggest:not(.seg) { box-shadow: inset 0 -1px hsl(var(--sh) 60% 50%); }
  .apply { font: 11px system-ui, sans-serif; border: 1px solid hsl(var(--h) 50% 55%); background: white;
           color: hsl(var(--h) 60% 30%); border-radius: 999px; padding: 0 6px; cursor: pointer; }

  /* labels: extra space between lines, each object's type written above where it starts.
     A label is a zero-width widget; --lvl stacks the labels of nested objects upward. */
  #editor.labels .ProseMirror { line-height: 3.4; }
  #editor .lbl { display: none; }
  #editor.labels .lbl { display: inline-block; position: relative; width: 0; }
  #editor .lbl > span { position: absolute; left: calc(-7px - var(--indent, 0) * 7px); bottom: calc(15px + var(--lvl) * 11px);
                        font: 10px/1 system-ui, sans-serif; color: hsl(var(--h) 60% 35%);
                        white-space: nowrap; pointer-events: none; user-select: none; }
  #editor .lbl.maybe > span { font-style: italic; opacity: 0.8; }

  #editor.plain .seg, #editor.plain .suggest { background: none; box-shadow: none; border: none; }
  #editor.plain .lbl { display: none; }

  h2 { font-size: 14px; margin: 18px 0 6px; color: #555; }
  #objects { font-size: 13px; color: #666; }
  .obj { display: flex; gap: 10px; padding: 3px 0; color: #222; }
  .otype { background: hsl(var(--h) 80% 90%); border: 1px solid hsl(var(--h) 50% 70%); border-radius: 999px;
           padding: 0 6px; min-width: 9em; font: inherit; font-size: 12px; }
  .otext { font-family: ui-monospace, monospace; flex: 1; }
  .addobj { display: flex; gap: 6px; margin-bottom: 8px; }
  .addobj input { flex: 1; max-width: 20em; font: inherit; font-size: 13px; }
  .ocount { color: #999; }
  .remove { border: none; background: none; color: #999; cursor: pointer; }
  .oid { color: #aaa; font-family: ui-monospace, monospace; }
  .hint { color: #888; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TextForm</h1>
    <label><input type="checkbox" id="overlay" checked> form overlay</label>
    <label><input type="checkbox" id="labels" checked> labels</label>
    <label><input type="checkbox" id="colors" checked> colours</label>
    <button id="reset">reset</button>
    <span id="mode"></span>
  </header>
  <div id="pills"></div>
  <div id="editor" class="labels"></div>
  <div class="hint">Select text and click a pill to tag it. With no selection a pill works like the bold button: on, type, off.
    Right-click a pill to remove it. Text and pills are saved in this browser.</div>
  <h2>Objects</h2>
  <div id="objects"></div>
</main>
<script src="dist/app.js"></script>
</body>
</html>
