<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextForm Cutter</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  main { padding: 8px 12px; }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
  h1 { font-size: 18px; margin: 0 8px 0 0; }
  header input, header select, header button { font: inherit; }
  #type { width: 9em; }
  #reset { margin-left: auto; }
  /* live updates off: what's shown is as of when they were turned off */
  body.paused #found, body.paused #table, body.paused .dict textarea { background: #f4f4f4; }
  body.paused label:has(#live) { color: #b06000; font-weight: 600; }

  #editor { height: calc(100vh - 70px); min-height: 160px; overflow: auto; resize: vertical;
            background: white; border: 1px solid #ccc; border-radius: 6px; }
  #editor .ProseMirror { padding: 8px 12px; min-height: 100%; box-sizing: border-box;
                         outline: none; font-family: ui-monospace, monospace;
                         /* no wrapping: a long line scrolls sideways inside the box */
                         white-space: pre; width: max-content; min-width: 100%; }
  #editor p { margin: 0; }
  /* one layer per found value; nested values build up the colour */
  /* #editor .found: its layers are set in cutter.js */
  .hint { color: #888; font-size: 12px; margin-top: 6px; }

  /* three columns: dictionaries | the text, as tall as the window | the types found and the table.
     The side columns scroll on their own, so they stay beside the text. */
  .layout { display: grid; grid-template-columns: minmax(220px, 18%) 1fr minmax(460px, 49%); gap: 12px; align-items: start; }
  .layout > aside { position: sticky; top: 8px; max-height: calc(100vh - 70px); overflow: auto; }
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    .layout > aside { position: static; max-height: none; }
    .layout > section { order: -1; } /* the text first */
  }
  .layout > section { min-width: 0; } /* a long line mustn't widen the middle column */
  h2 { font-size: 13px; margin: 0 0 4px; color: #555; }

  .dict { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 4px 6px; margin-bottom: 6px; }
  .dict.off { opacity: 0.5; }
  .dict .head { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
  .dict .name { font: 600 13px system-ui, sans-serif; border: none; flex: 1; }
  .dict textarea { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace; border: 1px solid #eee; resize: vertical;
                  white-space: pre; overflow-x: auto; } /* a rule a line: long ones scroll, they don't wrap */
  .remove { border: none; background: none; color: #999; cursor: pointer; font-size: 15px; }
  .add { font: inherit; font-size: 13px; }
  .adds { display: flex; gap: 6px; }
  .adds select { min-width: 0; flex: 1; }

  #found { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .type-pick { font: 12px ui-monospace, monospace; border: 1px solid #d8c060; background: #fffbe6;
               border-radius: 4px; padding: 1px 6px; cursor: pointer; color: #806600; }
  .type-pick.in { background: #ffe680; }
  .none { color: #bbb; font-size: 13px; }

  #tablebar { margin-bottom: 6px; }
  #columns { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; }
  #table table { border-collapse: collapse; font-size: 13px; background: white; }
  #table th { text-align: left; color: #806600; font-weight: 600; border-bottom: 1px solid #ddd; padding: 3px 10px 3px 0; }
  #table td { border-bottom: 1px solid #f0f0f0; padding: 3px 10px 3px 0; vertical-align: top; }
  #table td .cell { font: 12px ui-monospace, monospace; display: block; white-space: pre; } /* several values: one a line */
  #table .hole { color: #bbb; }
  #table .filters th { padding: 0 10px 4px 0; }
  #table .filters input { width: 100%; min-width: 5em; box-sizing: border-box; font: 12px ui-monospace, monospace;
                          border: 1px solid #e4e4e4; border-radius: 3px; padding: 1px 4px; }
  #table .count { color: #999; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TextForm Cutter</h1>
    <select id="samples" title="Load a text (the dictionaries stay as they are; Ctrl+Z undoes it)"></select>
    <span>cut selection as</span>
    <input id="type" list="types" placeholder="type" value="Keyword">
    <span>into</span>
    <select id="into"></select>
    <button id="cut" title="Cut the selection into the dictionary (Ctrl+Shift+X)">cut</button>
    <label title="Off: nothing is matched again while you type, in the text or a dictionary. On: catches up at once."><input type="checkbox" id="live" checked> live</label>
    <button id="reset">reset</button>
  </header>
  <datalist id="types"></datalist>
  <div class="layout">
    <aside><h2>Dictionaries</h2><div id="dicts"></div></aside>
    <section>
      <div id="editor" title="The text is never changed. Select some of it, give a type, and cut: that adds a Type:value line to a dictionary. Or type lines into a dictionary yourself. Loaded dictionaries light up their values."></div>
    </section>
    <aside>
      <h2 title="The types found in the text: click one to add it to the table, again to take it out">Found</h2><div id="found"></div>
      <h2 title="A row for each place the first type is found; the others are what's nearest it">Table</h2>
      <div id="tablebar"><input id="columns" placeholder="columns: types, e.g. Group, Date, URL+IP, or click them under Found"></div>
      <div id="table"></div>
    </aside>
  </div>
</main>
<script src="dist/samples.js"></script>
<script src="dist/cutter.js"></script>
</body>
</html>
